# Cloudflare Pages Configuration for Celeritas Spectrometry Lab
# This file configures the build and deployment settings for Cloudflare Pages

name = "celeritas-spectrometry"
compatibility_date = "2024-01-01"

# Build configuration
[build]
command = "npm run build"
cwd = "."
watch_dirs = ["src"]

# Output directory
[build.output]
directory = "dist"

# Environment variables (can be overridden in Cloudflare dashboard)
[vars]
NODE_ENV = "production"

# Redirects for SPA routing (fallback to index.html)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Headers for security and caching
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
